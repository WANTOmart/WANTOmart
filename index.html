<!DOCTYPE html>
<html>
<head>
  <title>Stok Barang Sederhana</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { margin: 5px; padding: 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px;}
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center;}
    th { background: #eee; }
  </style>
</head>
<body>

<h2>Tambah Barang</h2>

<input type="text" id="nama" placeholder="Nama Barang">
<input type="number" id="harga" placeholder="Harga Beli">
<input type="number" id="stok" placeholder="Stok">
<button onclick="simpan()">Simpan</button>

<h2>Data Barang</h2>

<table>
  <thead>
    <tr>
      <th>Nama</th>
      <th>Harga</th>
      <th>Stok</th>
      <th>Modal</th>
    </tr>
  </thead>
  <tbody id="tabel"></tbody>
</table>

<h3>Total Modal: <span id="total">Rp 0</span></h3>

<script>
let barang = JSON.parse(localStorage.getItem("barang")) || [];

function simpan() {
  let nama = document.getElementById("nama").value;
  let harga = parseInt(document.getElementById("harga").value);
  let stok = parseInt(document.getElementById("stok").value);

  if (!nama || !harga || !stok) {
    alert("Isi semua data!");
    return;
  }

  barang.push({ nama, harga, stok });

  localStorage.setItem("barang", JSON.stringify(barang));

  tampil();

  document.getElementById("nama").value = "";
  document.getElementById("harga").value = "";
  document.getElementById("stok").value = "";
}

function tampil() {
  let tabel = document.getElementById("tabel");
  tabel.innerHTML = "";

  let total = 0;

  barang.forEach((b) => {
    let modal = b.harga * b.stok;
    total += modal;

    tabel.innerHTML += `
      <tr>
        <td>${b.nama}</td>
        <td>Rp ${b.harga}</td>
        <td>${b.stok}</td>
        <td>Rp ${modal}</td>
      </tr>
    `;
  });

  document.getElementById("total").innerText = "Rp " + total;
}

tampil();
</script>

</body>
</html>
