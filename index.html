<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>WantoMart ULTRA</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; padding: 20px; background:#f5f5f5;}
input, button { padding: 6px; margin: 4px;}
table { border-collapse: collapse; width: 100%; margin-top:10px;}
th, td { border:1px solid #ccc; padding:8px; text-align:center;}
.warning { color:red; font-weight:bold;}
</style>
</head>

<body>

<h2>🛒 WantoMart ULTRA</h2>

<!-- ================= TAMBAH BARANG ================= -->
<h3>Tambah Barang</h3>
<input id="nama" placeholder="Nama">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">
<input id="modal" type="number" placeholder="Modal">
<button onclick="tambahBarang()">Simpan</button>

<!-- ================= DATA BARANG ================= -->
<h3>Data Barang</h3>
<button onclick="exportExcel()">Export Excel</button>
<button onclick="exportPDF()">Export PDF</button>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Harga</th>
<th>Stok</th>
<th>Modal</th>
</tr>
</thead>
<tbody id="data-barang"></tbody>
</table>

<!-- ================= TRANSAKSI ================= -->
<h3>Transaksi</h3>
<input id="inputTransaksi" placeholder="Nama barang">
<input id="qty" type="number" value="1">
<button onclick="handleTambah()">Tambah</button>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Harga</th>
<th>Qty</th>
<th>Total</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="data-transaksi"></tbody>
</table>

<h3>Total: Rp <span id="total">0</span></h3>

<button onclick="bayar()">Bayar</button>

<script>
let dataBarang = [];
let transaksi = [];

/* ================= LOCAL STORAGE ================= */
function simpanData() {
  localStorage.setItem("dataBarang", JSON.stringify(dataBarang));
}

function loadData() {
  let data = localStorage.getItem("dataBarang");
  if (data) dataBarang = JSON.parse(data);
}

/* ================= TAMBAH BARANG ================= */
function tambahBarang() {
  let nama = document.getElementById("nama").value;
  let harga = +document.getElementById("harga").value;
  let stok = +document.getElementById("stok").value;
  let modal = +document.getElementById("modal").value;

  dataBarang.push({ nama, harga, stok, modal });

  simpanData();
  renderDataBarang();
}

/* ================= RENDER BARANG ================= */
function renderDataBarang() {
  let el = document.getElementById("data-barang");
  el.innerHTML = "";

  dataBarang.forEach(b => {
    let warning = b.stok <= 3 ? '<span class="warning">⚠️</span>' : '';

    el.innerHTML += `
      <tr>
        <td>${b.nama}</td>
        <td>${b.harga}</td>
        <td>${b.stok} ${warning}</td>
        <td>${b.modal}</td>
      </tr>
    `;
  });
}

/* ================= TAMBAH TRANSAKSI ================= */
function handleTambah() {
  let input = document.getElementById("inputTransaksi").value;
  let qty = +document.getElementById("qty").value;

  let barang = dataBarang.find(b => b.nama === input);

  if (!barang) return alert("Barang tidak ditemukan!");
  if (barang.stok < qty) return alert("Stok tidak cukup!");

  let existing = transaksi.find(t => t.nama === barang.nama);

  if (existing) {
    existing.qty += qty;
  } else {
    transaksi.push({ nama: barang.nama, harga: barang.harga, qty });
  }

  barang.stok -= qty;

  simpanData();
  renderDataBarang();
  renderTransaksi();
}

/* ================= RENDER TRANSAKSI ================= */
function renderTransaksi() {
  let el = document.getElementById("data-transaksi");
  el.innerHTML = "";

  let total = 0;

  transaksi.forEach((t, i) => {
    let sub = t.harga * t.qty;
    total += sub;

    el.innerHTML += `
      <tr>
        <td>${t.nama}</td>
        <td>${t.harga}</td>
        <td>${t.qty}</td>
        <td>${sub}</td>
        <td><button onclick="hapusItem(${i})">Hapus</button></td>
      </tr>
    `;
  });

  document.getElementById("total").innerText = total;
}

/* ================= HAPUS ITEM ================= */
function hapusItem(index) {
  let item = transaksi[index];

  let barang = dataBarang.find(b => b.nama === item.nama);
  if (barang) barang.stok += item.qty;

  transaksi.splice(index, 1);

  simpanData();
  renderDataBarang();
  renderTransaksi();
}

/* ================= BAYAR ================= */
function bayar() {
  if (transaksi.length === 0) return alert("Belum ada transaksi");

  alert("Transaksi berhasil!");

  transaksi = [];
  renderTransaksi();
}

/* ================= EXPORT EXCEL ================= */
function exportExcel() {
  let csv = "Nama,Harga,Stok,Modal\n";

  dataBarang.forEach(b => {
    csv += `${b.nama},${b.harga},${b.stok},${b.modal}\n`;
  });

  let blob = new Blob([csv], { type: "text/csv" });
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "data_barang.csv";
  a.click();
}

/* ================= EXPORT PDF ================= */
function exportPDF() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  doc.text("Data Barang", 10, 10);

  let y = 20;
  dataBarang.forEach(b => {
    doc.text(`${b.nama} | ${b.harga} | ${b.stok}`, 10, y);
    y += 10;
  });

  doc.save("data_barang.pdf");
}

/* ================= INIT ================= */
loadData();
renderDataBarang();
</script>

</body>
</html>
