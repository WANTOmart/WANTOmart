<!DOCTYPE html>
<html>
<head>
  <title>WANTOMART ULTRA</title>
  <style>
    body { font-family: Arial; padding:20px; background:#f5f5f5; }
    input, button { padding:8px; margin:5px; }
    button { cursor:pointer; }
    table { width:100%; border-collapse:collapse; margin-top:10px; background:white; }
    th, td { border:1px solid #ccc; padding:8px; text-align:center; }
    th { background:#333; color:white; }
    .box { background:white; padding:15px; margin-bottom:20px; border-radius:10px; }
  </style>
</head>
<body>

<h2>🛒 WANTOMART ULTRA</h2>

<div class="box">
<h3>Tambah Barang</h3>
<input id="nama" placeholder="Nama Barang">
<input id="harga" type="number" placeholder="Harga">
<input id="stok" type="number" placeholder="Stok">
<button onclick="simpan()">Simpan</button>
</div>

<div class="box">
<h3>Data Barang</h3>
<table>
<thead>
<tr>
<th>Nama</th>
<th>Harga</th>
<th>Stok</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabel"></tbody>
</table>
</div>

<div class="box">
<h3>Transaksi</h3>

<input id="cari" placeholder="Scan / Nama Barang">
<button onclick="tambahTransaksi()">Tambah</button>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Qty</th>
<th>Harga</th>
<th>Subtotal</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="keranjang"></tbody>
</table>

<h3>Total: <span id="total">Rp 0</span></h3>

<input id="bayar" type="number" placeholder="Uang Bayar">
<button onclick="bayar()">Bayar</button>
</div>

<script>
let barang = JSON.parse(localStorage.getItem("barang")) || [];
let keranjang = [];

function rupiah(x){
  return "Rp " + x.toLocaleString("id-ID");
}

function simpan(){
  let nama = document.getElementById("nama").value;
  let harga = parseInt(document.getElementById("harga").value);
  let stok = parseInt(document.getElementById("stok").value);

  if(!nama) return alert("Nama kosong!");

  barang.push({nama, harga, stok});
  localStorage.setItem("barang", JSON.stringify(barang));

  tampilBarang();
}

function tampilBarang(){
  let html = "";
  barang.forEach((b,i)=>{
    html += `
    <tr>
      <td>${b.nama}</td>
      <td>${rupiah(b.harga)}</td>
      <td>${b.stok}</td>
      <td>
        <button onclick="hapus(${i})">Hapus</button>
      </td>
    </tr>`;
  });
  document.getElementById("tabel").innerHTML = html;
}

function hapus(i){
  barang.splice(i,1);
  localStorage.setItem("barang", JSON.stringify(barang));
  tampilBarang();
}

function tambahTransaksi(){
  let keyword = document.getElementById("cari").value.toLowerCase();

  let item = barang.find(b => b.nama.toLowerCase().includes(keyword));

  if(!item) return alert("Barang tidak ditemukan");

  let existing = keranjang.find(k => k.nama === item.nama);

  if(existing){
    existing.qty++;
  }else{
    keranjang.push({...item, qty:1});
  }

  tampilKeranjang();
}

function tampilKeranjang(){
  let html="";
  let total=0;

  keranjang.forEach((k,i)=>{
    let sub = k.qty * k.harga;
    total += sub;

    html += `
    <tr>
      <td>${k.nama}</td>
      <td>${k.qty}</td>
      <td>${rupiah(k.harga)}</td>
      <td>${rupiah(sub)}</td>
      <td><button onclick="hapusItem(${i})">❌</button></td>
    </tr>`;
  });

  document.getElementById("keranjang").innerHTML = html;
  document.getElementById("total").innerText = rupiah(total);
}

function hapusItem(i){
  keranjang.splice(i,1);
  tampilKeranjang();
}

function bayar(){
  let total = keranjang.reduce((s,k)=>s + k.qty*k.harga,0);
  let uang = parseInt(document.getElementById("bayar").value);

  if(uang < total) return alert("Uang kurang!");

  let kembali = uang - total;

  cetakStruk(total, uang, kembali);

  keranjang = [];
  tampilKeranjang();
}

function cetakStruk(total, bayar, kembali){
  let win = window.open("", "", "width=300");

  let isi = `
  <h3 style="text-align:center">WANTOMART</h3>
  <hr>`;

  keranjang.forEach(k=>{
    isi += `
    <div>${k.nama} x${k.qty}</div>
    <div>${rupiah(k.qty*k.harga)}</div>`;
  });

  isi += `
  <hr>
  <div>Total: ${rupiah(total)}</div>
  <div>Bayar: ${rupiah(bayar)}</div>
  <div>Kembali: ${rupiah(kembali)}</div>
  <hr>
  <div style="text-align:center">Terima Kasih 🙏</div>
  `;

  win.document.write(isi);
  win.print();
}

tampilBarang();
</script>

</body>
</html>
