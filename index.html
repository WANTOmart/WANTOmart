<!DOCTYPE html>
<html>
<head>
<title>WantoMart - Kasir PRO MAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body { font-family: Arial; padding:20px; background:#f2f2f2; }
input, button { padding:6px; margin:4px; }
table { border-collapse: collapse; width:100%; background:white; }
th, td { border:1px solid #ccc; padding:8px; text-align:center; }
button { cursor:pointer; }
.box { background:white; padding:15px; margin-bottom:20px; }
</style>
</head>
<body>

<h2>WANTOMART - KASIR PRO MAX</h2>

<div class="box">
<h3>Tambah Barang</h3>
Nama: <input type="text" id="nama">
Barcode: <input type="text" id="barcode">
Harga Beli: <input type="number" id="hargaBeli">
Harga Jual: <input type="number" id="hargaJual">
Stok: <input type="number" id="stok">
<button onclick="simpanBarang()">Simpan</button>
</div>

<div class="box">
<h3>Data Barang</h3>
<table id="tabelBarang">
<tr>
<th>Nama</th>
<th>Barcode</th>
<th>Jual</th>
<th>Stok</th>
<th>Aksi</th>
</tr>
</table>
</div>

<div class="box">
<h3>Scan Barang</h3>
<button onclick="startScanner()">📷 Scan</button>
<div id="reader" style="width:300px;"></div>

<h3>Keranjang</h3>
<table id="keranjangTable">
<tr>
<th>Nama</th>
<th>Qty</th>
<th>Harga</th>
<th>Subtotal</th>
<th>Hapus</th>
</tr>
</table>

<h3>Total: Rp <span id="total">0</span></h3>

Bayar: <input type="number" id="bayar" oninput="hitungKembalian()">
<h3>Kembalian: Rp <span id="kembalian">0</span></h3>

<button onclick="selesaiTransaksi()">Selesai</button>
</div>

<div class="box">
<h3>Laporan Hari Ini</h3>
Total Penjualan: Rp <span id="lapTotal">0</span><br>
Jumlah Transaksi: <span id="lapJumlah">0</span>
</div>

<script>
let barang = JSON.parse(localStorage.getItem("barang")) || [];
let keranjang = [];
let totalBelanja = 0;

function simpanData(){
localStorage.setItem("barang", JSON.stringify(barang));
}

function simpanBarang(){
barang.push({
nama: nama.value,
barcode: barcode.value,
hargaBeli: parseInt(hargaBeli.value),
hargaJual: parseInt(hargaJual.value),
stok: parseInt(stok.value)
});
simpanData();
tampilBarang();
}

function tampilBarang(){
let tabel=document.getElementById("tabelBarang");
tabel.innerHTML=`<tr>
<th>Nama</th><th>Barcode</th><th>Jual</th><th>Stok</th><th>Aksi</th></tr>`;
barang.forEach((b,i)=>{
tabel.innerHTML+=`
<tr>
<td>${b.nama}</td>
<td>${b.barcode}</td>
<td>${b.hargaJual}</td>
<td>${b.stok}</td>
<td><button onclick="hapusBarang(${i})">Hapus</button></td>
</tr>`;
});
}

function hapusBarang(i){
barang.splice(i,1);
simpanData();
tampilBarang();
}

function startScanner(){
let html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
{ facingMode:"environment"},
{ fps:10, qrbox:250},
(decodedText)=>{
prosesScan(decodedText);
});
}

function prosesScan(kode){
let item=barang.find(b=>b.barcode==kode);
if(!item) return;
if(item.stok<=0) return;

item.stok-=1;

let ada=keranjang.find(k=>k.barcode==kode);
if(ada){
ada.qty+=1;
ada.subtotal=ada.qty*ada.harga;
}else{
keranjang.push({
nama:item.nama,
barcode:item.barcode,
harga:item.hargaJual,
qty:1,
subtotal:item.hargaJual
});
}
renderKeranjang();
tampilBarang();
}

function renderKeranjang(){
let tabel=document.getElementById("keranjangTable");
tabel.innerHTML=`<tr>
<th>Nama</th><th>Qty</th><th>Harga</th><th>Subtotal</th><th>Hapus</th></tr>`;

totalBelanja=0;

keranjang.forEach((k,i)=>{
totalBelanja+=k.subtotal;
tabel.innerHTML+=`
<tr>
<td>${k.nama}</td>
<td>${k.qty}</td>
<td>${k.harga}</td>
<td>${k.subtotal}</td>
<td><button onclick="hapusItem(${i})">X</button></td>
</tr>`;
});

document.getElementById("total").innerText=totalBelanja;
}

function hapusItem(i){
let item=keranjang[i];
let data=barang.find(b=>b.barcode==item.barcode);
data.stok+=item.qty;
keranjang.splice(i,1);
renderKeranjang();
tampilBarang();
}

function hitungKembalian(){
let bayar=parseInt(document.getElementById("bayar").value)||0;
let kembali=bayar-totalBelanja;
document.getElementById("kembalian").innerText=kembali>0?kembali:0;
}

function selesaiTransaksi(){
if(keranjang.length==0) return;

let laporan=JSON.parse(localStorage.getItem("laporan"))||{total:0,jumlah:0};
laporan.total+=totalBelanja;
laporan.jumlah+=1;
localStorage.setItem("laporan",JSON.stringify(laporan));

keranjang=[];
renderKeranjang();
document.getElementById("bayar").value="";
hitungKembalian();
updateLaporan();
}

function updateLaporan(){
let laporan=JSON.parse(localStorage.getItem("laporan"))||{total:0,jumlah:0};
document.getElementById("lapTotal").innerText=laporan.total;
document.getElementById("lapJumlah").innerText=laporan.jumlah;
}

tampilBarang();
updateLaporan();
</script>

</body>
</html>
