<!DOCTYPE html>
<html>
<head>
<title>WantoMart ULTRA</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{font-family:Arial;background:#f2f2f2;padding:15px}
.box{background:white;padding:15px;margin-bottom:15px;border-radius:10px}
button{background:#2196f3;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer}
input,select{padding:5px;margin:3px}
table{width:100%;border-collapse:collapse;background:white}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
.dark{background:#121212;color:white}
.dark .box{background:#1e1e1e}
.low{color:red;font-weight:bold}
</style>
</head>

<body>

<h2>🏪 WANTOMART ULTRA</h2>
<button onclick="toggleDark()">🌙 Dark Mode</button>

<!-- LOGIN -->
<div id="loginBox" class="box">
<h3>Login</h3>
<select id="role">
<option value="admin">Admin</option>
<option value="kasir">Kasir</option>
</select>
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- TAMBAH BARANG -->
<div class="box">
<h3>Tambah Barang</h3>
<input id="nama" placeholder="Nama">
<input id="barcode" placeholder="Barcode">
<button onclick="scanTambah()">📷 Scan</button>
<br>
<input type="number" id="hargaBeli" placeholder="Harga Beli">
<input type="number" id="hargaJual" placeholder="Harga Jual">
<input type="number" id="stok" placeholder="Stok">
<br>
<button onclick="simpanBarang()">Simpan</button>

<div id="readerTambah" style="width:250px"></div>
</div>

<!-- DATA BARANG -->
<div class="box">
<h3>Data Barang</h3>
<input id="cari" placeholder="Cari..." oninput="tampilBarang()">
<table id="tabelBarang"></table>
</div>

<!-- TRANSAKSI -->
<div class="box">
<h3>Transaksi</h3>

<input id="inputManual" placeholder="Scan/Ketik Barcode"
onkeypress="if(event.key==='Enter')prosesManual()">

<button onclick="prosesManual()">Tambah</button>
<button onclick="startScanner()">📷 Scan</button>

<div id="reader" style="width:250px"></div>

<h3>Keranjang</h3>
<table id="keranjangTable"></table>

<h3>Total Rp <span id="total">0</span></h3>

<select id="metodeBayar">
<option>Cash</option>
<option>QRIS</option>
<option>Transfer</option>
</select>

<input type="number" id="bayar" placeholder="Bayar" oninput="hitungKembalian()">
<h3>Kembalian Rp <span id="kembalian">0</span></h3>

<button onclick="selesaiTransaksi()">Selesai</button>
<button onclick="cetakStruk()">🧾 Cetak</button>
</div>

<!-- LAPORAN -->
<div class="box">
<h3>Laporan Hari Ini</h3>
Total Rp <span id="lapTotal">0</span><br>
Transaksi <span id="lapJumlah">0</span><br>
Laba Rp <span id="lapLaba">0</span>
</div>

<div class="box">
<h3>Grafik Bulanan</h3>
<canvas id="grafik"></canvas>
</div>

<script>
let barang = JSON.parse(localStorage.getItem("barang")) || [];
let keranjang = [];
let totalBelanja = 0;
let currentRole = "";

// DARK MODE
function toggleDark(){
document.body.classList.toggle("dark");
}

// LOGIN
function login(){
let roleVal = document.getElementById("role").value;
let pass = document.getElementById("password").value;

if((roleVal=="admin" && pass=="1234") || (roleVal=="kasir" && pass=="1111")){
currentRole = roleVal;
document.getElementById("loginBox").style.display="none";
}else alert("Password salah");
}

// SIMPAN BARANG
function simpanBarang(){
barang.push({
nama: nama.value,
barcode: barcode.value,
hargaBeli: parseInt(hargaBeli.value)||0,
hargaJual: parseInt(hargaJual.value)||0,
stok: parseInt(stok.value)||0
});

localStorage.setItem("barang", JSON.stringify(barang));
tampilBarang();
}

// TAMPIL BARANG
function tampilBarang(){
let cariVal = document.getElementById("cari").value.toLowerCase();
let t = document.getElementById("tabelBarang");

t.innerHTML = "<tr><th>Nama</th><th>Barcode</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr>";

barang
.filter(b=>b.nama.toLowerCase().includes(cariVal) || b.barcode.includes(cariVal))
.forEach((b,i)=>{
t.innerHTML += `
<tr>
<td>${b.nama}</td>
<td>${b.barcode}</td>
<td>${b.hargaJual}</td>
<td class="${b.stok<=5?'low':''}">${b.stok}</td>
<td>${currentRole=="admin"?`<button onclick="hapusBarang(${i})">Hapus</button>`:"-"}</td>
</tr>`;
});
}

// HAPUS BARANG
function hapusBarang(i){
barang.splice(i,1);
localStorage.setItem("barang", JSON.stringify(barang));
tampilBarang();
}

// SCANNER TAMBAH BARANG
let scannerTambah;
function scanTambah(){
if(scannerTambah) scannerTambah.stop();

scannerTambah = new Html5Qrcode("readerTambah");

scannerTambah.start(
{ facingMode: "environment" },
{ fps: 10, qrbox: 200 },
(decodedText)=>{
document.getElementById("barcode").value = decodedText;
scannerTambah.stop();
});
}

// SCANNER TRANSAKSI
let scanner;
function startScanner(){
if(scanner) scanner.stop();

scanner = new Html5Qrcode("reader");

scanner.start(
{ facingMode:"environment"},
{ fps:10, qrbox:250},
(decodedText)=>{
prosesScan(decodedText);
});
}

// INPUT MANUAL
function prosesManual(){
prosesScan(document.getElementById("inputManual").value);
document.getElementById("inputManual").value="";
}

// PROSES SCAN
function prosesScan(kode){
let item = barang.find(b=>b.barcode==kode);
if(!item || item.stok<=0) return;

item.stok--;

let ada = keranjang.find(k=>k.barcode==kode);

if(ada){
ada.qty++;
ada.subtotal = ada.qty * ada.harga;
}else{
keranjang.push({
nama:item.nama,
barcode:item.barcode,
harga:item.hargaJual,
hargaBeli:item.hargaBeli,
qty:1,
subtotal:item.hargaJual,
laba:item.hargaJual-item.hargaBeli
});
}

renderKeranjang();
tampilBarang();
}

// RENDER KERANJANG
function renderKeranjang(){
let t = document.getElementById("keranjangTable");

t.innerHTML = "<tr><th>Nama</th><th>Qty</th><th>Harga</th><th>Subtotal</th><th>Hapus</th></tr>";

totalBelanja = 0;

keranjang.forEach((k,i)=>{
totalBelanja += k.subtotal;

t.innerHTML += `
<tr>
<td>${k.nama}</td>
<td>${k.qty}</td>
<td>${k.harga}</td>
<td>${k.subtotal}</td>
<td><button onclick="hapusItem(${i})">X</button></td>
</tr>`;
});

document.getElementById("total").innerText = totalBelanja;
}

// HAPUS ITEM
function hapusItem(i){
let item = keranjang[i];
let data = barang.find(b=>b.barcode==item.barcode);

if(data) data.stok += item.qty;

keranjang.splice(i,1);
renderKeranjang();
tampilBarang();
}

// KEMBALIAN
function hitungKembalian(){
let bayar = parseInt(document.getElementById("bayar").value)||0;
let kembali = bayar - totalBelanja;

document.getElementById("kembalian").innerText = kembali>0?kembali:0;
}

// SELESAI
function selesaiTransaksi(){
if(keranjang.length==0) return;

let today = new Date().toISOString().split("T")[0];
let laporan = JSON.parse(localStorage.getItem("laporan"))||{};

if(!laporan[today]) laporan[today]={total:0,jumlah:0,laba:0};

laporan[today].total += totalBelanja;
laporan[today].jumlah++;
laporan[today].laba += keranjang.reduce((s,i)=>s+(i.laba*i.qty),0);

localStorage.setItem("laporan", JSON.stringify(laporan));

keranjang=[];
renderKeranjang();
document.getElementById("bayar").value="";
hitungKembalian();
updateLaporan();
updateGrafik();
}

// LAPORAN
function updateLaporan(){
let today = new Date().toISOString().split("T")[0];
let laporan = JSON.parse(localStorage.getItem("laporan"))||{};
let d = laporan[today]||{total:0,jumlah:0,laba:0};

lapTotal.innerText=d.total;
lapJumlah.innerText=d.jumlah;
lapLaba.innerText=d.laba;
}

// GRAFIK
function updateGrafik(){
let laporan = JSON.parse(localStorage.getItem("laporan"))||{};
let bulanData={};

for(let t in laporan){
let b=t.substring(0,7);
bulanData[b]=(bulanData[b]||0)+laporan[t].total;
}

new Chart(grafik,{
type:'bar',
data:{
labels:Object.keys(bulanData),
datasets:[{label:'Penjualan',data:Object.values(bulanData)}]
}
});
}

// CETAK
function cetakStruk(){
let isi="<center><b>WANTOMART</b></center><hr>";

keranjang.forEach(k=>{
isi+=`${k.nama} x${k.qty} = ${k.subtotal}<br>`;
});

isi+="<hr>Total "+totalBelanja;

let w=window.open("");
w.document.write(isi);
w.print();
}

// INIT
tampilBarang();
updateLaporan();
updateGrafik();
</script>

</body>
</html>
