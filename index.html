<!DOCTYPE html>
<html>
<head>
  <title>Stok Barang</title>
  <style>
    body { font-family: Arial; padding: 20px; background:#f5f5f5; }
    input, button { margin: 5px; padding: 8px; }
    button { cursor:pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; background:#fff;}
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center;}
    th { background: #333; color:white; }
    .aksi button { margin:2px; }
  </style>
</head>
<body>

<h2>Tambah / Edit Barang</h2>

<input type="text" id="nama" placeholder="Nama Barang">
<input type="number" id="harga" placeholder="Harga Beli">
<input type="number" id="stok" placeholder="Stok">
<button onclick="simpan()">Simpan</button>

<h2>Data Barang</h2>

<table>
  <thead>
    <tr>
      <th>Nama</th>
      <th>Harga</th>
      <th>Stok</th>
      <th>Modal</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody id="tabel"></tbody>
</table>

<h3>Total Modal: <span id="total">Rp 0</span></h3>

<script>
let barang = JSON.parse(localStorage.getItem("barang")) || [];
let editIndex = -1;

function formatRupiah(angka) {
  return "Rp " + angka.toLocaleString("id-ID");
}

function simpan() {
  let nama = document.getElementById("nama").value.trim();
  let harga = parseInt(document.getElementById("harga").value) || 0;
  let stok = parseInt(document.getElementById("stok").value) || 0;

  if (nama === "") {
    alert("Nama wajib diisi!");
    return;
  }

  if (editIndex === -1) {
    barang.push({ nama, harga, stok });
  } else {
    barang[editIndex] = { nama, harga, stok };
    editIndex = -1;
  }

  localStorage.setItem("barang", JSON.stringify(barang));
  tampil();
  resetForm();
}

function tampil() {
  let tabel = document.getElementById("tabel");
  tabel.innerHTML = "";

  let total = 0;

  barang.forEach((b, i) => {
    let modal = b.harga * b.stok;
    total += modal;

    tabel.innerHTML += `
      <tr>
        <td>${b.nama}</td>
        <td>${formatRupiah(b.harga)}</td>
        <td>${b.stok}</td>
        <td>${formatRupiah(modal)}</td>
        <td class="aksi">
          <button onclick="edit(${i})">Edit</button>
          <button onclick="hapus(${i})">Hapus</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("total").innerText = formatRupiah(total);
}

function edit(i) {
  let b = barang[i];
  document.getElementById("nama").value = b.nama;
  document.getElementById("harga").value = b.harga;
  document.getElementById("stok").value = b.stok;

  editIndex = i;
}

function hapus(i) {
  if (confirm("Yakin hapus data?")) {
    barang.splice(i, 1);
    localStorage.setItem("barang", JSON.stringify(barang));
    tampil();
  }
}

function resetForm() {
  document.getElementById("nama").value = "";
  document.getElementById("harga").value = "";
  document.getElementById("stok").value = "";
}

tampil();
</script>

</body>
</html>
